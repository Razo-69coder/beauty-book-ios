name: SolvoBeauty
options:
  bundleIdPrefix: com.solvobeauty
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "8"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  SolvoBeauty:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.yml"
          - ".github"
          - "codemagic.yaml"
          - "project.yml"
          - "Package.swift"
          - "commit.ps1"
          - "push*.ps1"
          - ".git"
          - "SolvoWidget"
    resources:
      - path: .
        includes:
          - "*.png"
          - "*.jpg"
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solvobeauty.app
        INFOPLIST_FILE: Info.plist
        DEVELOPMENT_TEAM: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: BeautyBook.entitlements
        # Профиль подставляет Codemagic (APP_PROFILE_UUID) — у приложения и виджета разные профили
        PROVISIONING_PROFILE: "$(APP_PROFILE_UUID)"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleName: SolvoBeauty
        CFBundleDisplayName: Solvo Beauty
        CFBundleIdentifier: com.solvobeauty.app
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundlePackageType: APPL
        CFBundleExecutable: SolvoBeauty
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSContactsUsageDescription: "Solvo Beauty использует контакты для быстрого добавления клиентов"
        NSCameraUsageDescription: "Solvo Beauty использует камеру для фото работ клиента"
        NSPhotoLibraryUsageDescription: "Solvo Beauty использует галерею для фото работ клиента"
        NSPhotoLibraryAddUsageDescription: "Solvo Beauty сохраняет фото работ"
        NSCalendarsWriteOnlyAccessUsageDescription: "Solvo Beauty добавляет ваши записи в Календарь iPhone"
        NSSupportsLiveActivities: true
    dependencies:
      - target: SolvoBeautyWidget

  # Виджет «Сегодня» + Live Activity (экран блокировки)
  SolvoBeautyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SolvoWidget
      - path: SolvoShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solvobeauty.app.widget
        PROVISIONING_PROFILE: "$(WIDGET_PROFILE_UUID)"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: SolvoWidget/Info.plist
      properties:
        CFBundleName: SolvoBeautyWidget
        CFBundleDisplayName: Solvo Beauty
        CFBundleIdentifier: com.solvobeauty.app.widget
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundlePackageType: XPC!
        CFBundleExecutable: SolvoBeautyWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SolvoWidget/SolvoWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.solvobeauty.app