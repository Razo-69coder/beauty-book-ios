workflows:
  ios-testflight:
    name: Solva Beauty - TestFlight
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.solvobeauty.app
    scripts:
      - name: Install XcodeGen
        script: |
          which xcodegen || brew install xcodegen

      - name: Generate app icons
        script: |
          mkdir -p Assets.xcassets/AppIcon.appiconset
          LOGO="solva_logo.png"
          OUT="Assets.xcassets/AppIcon.appiconset"
          sips -z 40 40   "$LOGO" --out "$OUT/icon_20@2x.png"
          sips -z 60 60   "$LOGO" --out "$OUT/icon_20@3x.png"
          sips -z 58 58   "$LOGO" --out "$OUT/icon_29@2x.png"
          sips -z 87 87   "$LOGO" --out "$OUT/icon_29@3x.png"
          sips -z 80 80   "$LOGO" --out "$OUT/icon_40@2x.png"
          sips -z 120 120 "$LOGO" --out "$OUT/icon_40@3x.png"
          sips -z 120 120 "$LOGO" --out "$OUT/icon_60@2x.png"
          sips -z 180 180 "$LOGO" --out "$OUT/icon_60@3x.png"
          # 1024x1024 must NOT have alpha channel — flatten via JPEG
          sips -z 1024 1024 "$LOGO" --out /tmp/icon_1024.jpg --setProperty format jpeg
          sips /tmp/icon_1024.jpg --out "$OUT/icon_1024.png" --setProperty format png

      - name: Generate project
        script: |
          xcodegen generate

      - name: Set build number
        script: |
          BUILD_NUM=$(grep 'CURRENT_PROJECT_VERSION' project.yml | grep -oE '[0-9]+' | head -1)
          echo "Setting build number: $BUILD_NUM"
          agvtool new-version -all $BUILD_NUM

      - name: Find provisioning profiles
        script: |
          # Приложение и виджет подписываются каждый своим профилем — ищем их по Bundle ID
          find_profile() {
            for P in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
              security cms -D -i "$P" > /tmp/profile.plist 2>/dev/null || continue
              APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist 2>/dev/null)
              if [ "$APPID" = "53C33F97M2.$1" ]; then
                /usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist
                return
              fi
            done
          }
          APP_UUID=$(find_profile com.solvobeauty.app)
          WIDGET_UUID=$(find_profile com.solvobeauty.app.widget)
          echo "App profile: $APP_UUID"
          echo "Widget profile: $WIDGET_UUID"
          if [ -z "$APP_UUID" ] || [ -z "$WIDGET_UUID" ]; then
            echo "ОШИБКА: нет профиля для приложения или виджета. Установлены:"
            ls ~/Library/MobileDevice/Provisioning\ Profiles/
            exit 1
          fi
          echo "APP_UUID=$APP_UUID" >> $CM_ENV
          echo "WIDGET_UUID=$WIDGET_UUID" >> $CM_ENV

      - name: Build for App Store
        script: |
          xcodebuild             -project SolvoBeauty.xcodeproj             -scheme SolvoBeauty             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -archivePath ./build/BeautyBook.xcarchive             CODE_SIGN_STYLE=Manual             CODE_SIGN_IDENTITY="Apple Distribution"             CODE_SIGNING_REQUIRED=YES             CODE_SIGNING_ALLOWED=YES             APP_PROFILE_UUID="$APP_UUID"             WIDGET_PROFILE_UUID="$WIDGET_UUID"             DEVELOPMENT_TEAM=53C33F97M2             archive

      - name: Export IPA
        script: |
          cat > ./export_options_runtime.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>53C33F97M2</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.solvobeauty.app</key>
                  <string>$APP_UUID</string>
                  <key>com.solvobeauty.app.widget</key>
                  <string>$WIDGET_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild             -exportArchive             -archivePath ./build/BeautyBook.xcarchive             -exportOptionsPlist ./export_options_runtime.plist             -exportPath ./build/ipa

      - name: Upload to TestFlight
        script: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_VK5U33NHSR.p8
          IPA=$(find ./build/ipa -name "*.ipa" | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apple-id "6787732588" \
            --apiKey "VK5U33NHSR" \
            --apiIssuer "28f09b58-6de2-42ee-9c2c-116ba4d3f74b"

    artifacts:
      - ./build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log




